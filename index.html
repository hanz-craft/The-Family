<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Family Fishing Game</title>
    <style>
        :root {
            --font-family: 'Comic Sans MS', 'Chalkboard SE', 'Arial Rounded MT Bold', sans-serif;
            --primary-blue: #0288d1;
            --light-blue: #4fc3f7;
            --pond-blue: #29b6f6;
            --sand-yellow: #fff9c4;
            --grass-green: #81c784;
            --sun-yellow: #ffca28;
            --card-white: #ffffff;
            --text-dark: #37474f;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            background: #e0f7fa;
            color: var(--text-dark);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-container {
            width: 100%;
            height: 100%;
            max-width: 1200px;
            max-height: 800px;
            background: linear-gradient(to bottom, #b3e5fc 0%, #e0f2f1 100%);
            position: relative;
            display: flex;
            flex-direction: column;
            border: 8px solid #4db6ac;
            border-radius: 24px;
            box-shadow: 0 12px 36px rgba(0,0,0,0.15);
            overflow: hidden;
        }

        /* Top Bar Interface */
        header {
            height: 70px;
            background: linear-gradient(to bottom, #ffffff, #f5f5f5);
            border-bottom: 4px solid #b2dfdb;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            z-index: 10;
        }

        h1 {
            font-size: 28px;
            color: #00796b;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.1);
        }

        .controls-score {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .score-box {
            background: #fff;
            padding: 6px 16px;
            border: 3px solid #00acc1;
            border-radius: 16px;
            font-size: 20px;
            font-weight: bold;
            color: #00796b;
        }

        .btn-round {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            border: 3px solid #00acc1;
            background: white;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            box-shadow: 0 4px 0 #00838f;
            transition: transform 0.1s;
        }

        .btn-round:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        /* Main Workspace Split Layout */
        #main-layout {
            flex: 1;
            display: flex;
            position: relative;
            overflow: hidden;
        }

        /* Left Side: Fishing Area */
        #fishing-area {
            flex: 7;
            position: relative;
            background: linear-gradient(to bottom, var(--light-blue) 0%, #26c6da 40%, var(--primary-blue) 100%);
            overflow: hidden;
            border-right: 6px solid #4db6ac;
        }

        .sky-decor {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 25%;
            background: linear-gradient(to bottom, #80deea 0%, transparent 100%);
            pointer-events: none;
        }

        .sun {
            position: absolute;
            top: 10px;
            left: 20px;
            width: 50px;
            height: 50px;
            background: var(--sun-yellow);
            border-radius: 50%;
            box-shadow: 0 0 20px #fbc02d;
            animation: pulse 4s infinite ease-in-out;
        }

        .prompt-banner {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            border: 4px solid #ff7043;
            border-radius: 20px;
            padding: 8px 24px;
            font-size: 24px;
            font-weight: bold;
            color: #d84315;
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
            text-align: center;
            z-index: 5;
            animation: float 3s ease-in-out infinite;
        }

        .seaweed {
            position: absolute;
            bottom: 0;
            width: 40px;
            height: 120px;
            fill: #4caf50;
            opacity: 0.7;
            pointer-events: none;
        }

        /* Dynamic Fish Elements */
        .fish {
            position: absolute;
            width: 130px;
            height: 75px;
            cursor: pointer;
            transition: transform 0.1s ease;
            z-index: 3;
        }

        .fish-body {
            width: 100%;
            height: 100%;
        }

        .fish-text {
            position: absolute;
            top: 50%;
            left: 45%;
            transform: translate(-50%, -50%);
            font-size: 16px;
            font-weight: bold;
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            pointer-events: none;
            white-space: nowrap;
        }

        /* Right Side: Vocabulary Panel */
        #vocabulary-panel {
            flex: 3;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        .card-display {
            width: 100%;
            height: 85%;
            border: 4px dashed #90caf9;
            border-radius: 20px;
            background: #f9f9f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
            transition: background-color 0.3s;
        }

        .card-display.highlight {
            background-color: #fff9c4;
            border-color: #ffb300;
        }

        .vector-avatar-container {
            width: 180px;
            height: 180px;
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .vector-avatar-container svg {
            width: 100%;
            height: 100%;
        }

        .vocab-word {
            font-size: 32px;
            font-weight: bold;
            color: #1565c0;
            margin-bottom: 15px;
            letter-spacing: 1px;
            text-align: center;
        }

        .vocab-word.active-speaking {
            color: #e65100;
            scale: 1.1;
            transition: all 0.2s;
        }

        .btn-speak {
            background: #ff7043;
            color: white;
            border: none;
            padding: 10px 24px;
            font-size: 18px;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 0 #d84315;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-speak:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        /* Bottom Bar Tracker */
        footer {
            height: 75px;
            background: #e8f5e9;
            border-top: 4px solid #a5d6a7;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            z-index: 10;
        }

        .tracker-title {
            font-size: 18px;
            font-weight: bold;
            color: #2e7d32;
        }

        .star-container {
            display: flex;
            gap: 8px;
        }

        .star-slot {
            font-size: 32px;
            color: #c8e6c9;
            text-shadow: 1px 1px 0px #fff;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .star-slot.earned {
            color: #ffca28;
            animation: pop 0.4s ease-out;
            text-shadow: 1px 2px 2px rgba(0,0,0,0.2);
        }

        /* Modal Overlays */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .modal-card {
            background: white;
            padding: 40px;
            border-radius: 32px;
            border: 8px solid #ffb74d;
            text-align: center;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            animation: scaleUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-title {
            font-size: 36px;
            color: #e65100;
            margin-bottom: 15px;
        }

        .modal-body {
            font-size: 20px;
            margin-bottom: 25px;
            color: #546e7a;
            line-height: 1.5;
        }

        .btn-large {
            background: #4caf50;
            color: white;
            font-size: 24px;
            font-weight: bold;
            padding: 14px 40px;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 6px 0 #388e3c;
            transition: transform 0.1s;
        }

        .btn-large:active {
            transform: translateY(6px);
            box-shadow: none;
        }

        /* Confetti Effects Canvas */
        #fx-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 90;
        }

        /* Animations */
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }
        @keyframes float {
            0%, 100% { transform: translate(-50%, 0px); }
            50% { transform: translate(-50%, -6px); }
        }
        @keyframes pop {
            0% { transform: scale(0); }
            90% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }
        @keyframes scaleUp {
            0% { transform: scale(0.6); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .hidden {
            display: none !important;
        }

        /* Responsive scaling adjustment */
        @media (max-width: 768px) {
            #main-layout {
                flex-direction: column;
            }
            #fishing-area {
                flex: 6;
                border-right: none;
                border-bottom: 6px solid #4db6ac;
            }
            #vocabulary-panel {
                flex: 4;
                flex-direction: row;
                padding: 10px;
            }
            .card-display {
                flex-direction: row;
                height: 100%;
                justify-content: space-around;
            }
            .vector-avatar-container {
                width: 110px;
                height: 110px;
                margin-bottom: 0;
            }
            .vocab-word {
                font-size: 24px;
                margin-bottom: 0;
            }
        }
    </style>
</head>
<body>

        ];

        /**********************************************************************
         * PROCEDURAL AUDIO ENGINE (WEB AUDIO API SYNTHESIZERS)
         **********************************************************************/
        class AudioEngine {
            constructor() {
                this.ctx = null;
                this.musicInterval = null;
                this.sfxMuted = false;
                this.musicMuted = false;
                this.musicTempo = 140; 
                this.melody = [
                    60, 64, 67, 64, 65, 69, 72, 69,
                    67, 71, 74, 71, 72, 72, 72, 72
                ];
                this.musicStep = 0;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                    this.startMusicLoop();
                }
            }

            playTone(freq, type, duration, vol = 0.2, delay = 0) {
                if (this.sfxMuted || !this.ctx) return;
                
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                
                osc.type = type;
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime + delay);
                
                gain.gain.setValueAtTime(vol, this.ctx.currentTime + delay);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + delay + duration);
                
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                
                osc.start(this.ctx.currentTime + delay);
                osc.stop(this.ctx.currentTime + delay + duration);
            }

            playSuccess() {
                const now = 0;
                this.playTone(523.25, 'sine', 0.15, 0.25, now);     // C5
                this.playTone(659.25, 'sine', 0.15, 0.25, now + 0.08); // E5
                this.playTone(783.99, 'sine', 0.15, 0.25, now + 0.16); // G5
                this.playTone(1046.50, 'sine', 0.3, 0.3, now + 0.24);  // C6
            }

            playError() {
                this.playTone(293.66, 'triangle', 0.15, 0.3, 0); // D4
                this.playTone(220.00, 'triangle', 0.25, 0.3, 0.1); // A3
            }

            playMilestone() {
                let now = 0;
                const notes = [523.25, 587.33, 659.25, 698.46, 783.99, 880.00, 987.77, 1046.50];
                notes.forEach((freq, idx) => {
                    this.playTone(freq, 'sine', 0.2, 0.2, now);
                    now += 0.08;
                });
            }

            startMusicLoop() {
                if (this.musicInterval) clearInterval(this.musicInterval);
                
                const stepDuration = 60 / this.musicTempo;
                this.musicInterval = setInterval(() => {
                    if (this.musicMuted || !this.ctx) return;
                    
                    let midiNote = this.melody[this.musicStep];
                    let freq = 440 * Math.pow(2, (midiNote - 69) / 12);
                    
                    // Soft synth accompaniment pluck
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(0.04, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.4);
                    
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.4);
                    
                    this.musicStep = (this.musicStep + 1) % this.melody.length;
                }, stepDuration * 1000);
            }
        }

        const AudioSystem = new AudioEngine();

        /**********************************************************************
         * GAME STATE & ARCHITECTURE ENGINE
         **********************************************************************/
        const VOCABULARY = ["Father", "Mother", "Brother", "Sister", "Grandfather", "Grandmother", "Baby", "Family"];
        
        let state = {
            score: 0,
            correctCount: 0,
            pool: [...VOCABULARY],
            targetWord: "",
            activeFish: [],
            lastTime: 0,
            speechSynth: window.speechSynthesis,
            voicesReady: false
        };

        // UI Target Bindings
        const elFishingArea = document.getElementById('fishing-area');
        const elTargetPrompt = document.getElementById('target-prompt');
        const elScore = document.getElementById('score-val');
        const elStarFrame = document.getElementById('star-frame');
        const elAvatarContainer = document.getElementById('avatar-container');
        const elWordDisplay = document.getElementById('word-display');
        const elBtnSpeak = document.getElementById('btn-speak-action');
        const elCardDisplay = document.getElementById('card-display');
        
        // Modal Target Bindings
        const elStartOverlay = document.getElementById('start-overlay');
        const elBtnStart = document.getElementById('btn-start');
        const elMilestoneOverlay = document.getElementById('milestone-overlay');
        const elMilestoneTitle = document.getElementById('milestone-title');
        const elMilestoneText = document.getElementById('milestone-text');
        const elBtnMilestoneContinue = document.getElementById('btn-milestone-continue');
        
        // Particle FX system elements
        const canvasFx = document.getElementById('fx-canvas');
        const ctxFx = canvasFx.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvasFx.width = canvasFx.offsetWidth;
            canvasFx.height = canvasFx.offsetHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        /**********************************************************************
         * SPEECH ENGINE COUPLING
         **********************************************************************/
        function speak(text, callback) {
            if (!state.speechSynth) return;
            state.speechSynth.cancel(); // Terminate preceding statements instantly
            
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.85; // Child accessible processing rate
            utterance.pitch = 1.25; // Warm energetic kindergarten tone
            
            if (callback) {
                utterance.onend = callback;
            }
            state.speechSynth.speak(utterance);
        }

        /**********************************************************************
         * GAME LOGIC FLOW MANAGEMENT
         **********************************************************************/
        function initGame() {
            buildTrackerSlots();
            selectNextTarget();
            spawnInitialFish();
            requestAnimationFrame(gameLoop);
        }

        function buildTrackerSlots() {
            elStarFrame.innerHTML = '';
            for(let i = 0; i < VOCABULARY.length; i++) {
                let slot = document.createElement('span');
                slot.className = 'star-slot';
                slot.id = `star-slot-${i}`;
                slot.innerHTML = '★';
                elStarFrame.appendChild(slot);
            }
        }

        function selectNextTarget() {
            if (state.pool.length === 0) {
                // All words learned successfully
                triggerEndGameCelebration();
                return;
            }
            const randIdx = Math.floor(Math.random() * state.pool.length);
            state.targetWord = state.pool[randIdx];
            
            elTargetPrompt.innerHTML = `Find: <strong>${state.targetWord}</strong>`;
            speak(`Can you find ${state.targetWord}?`);
            
            // Ensure a fish carrying the newly selected target word exists immediately
            ensureTargetFishExists();
        }

        function ensureTargetFishExists() {
            const match = state.activeFish.find(f => f.word === state.targetWord);
            if (!match) {
                createFishInstance(state.targetWord);
            }
        }

        function spawnInitialFish() {
            // Populate pool landscape with assorted alternate targets
            let options = [...VOCABULARY];
            for (let i = 0; i < 4; i++) {
                let word = options[Math.floor(Math.random() * options.length)];
                createFishInstance(word);
            }
            ensureTargetFishExists();
        }

        function createFishInstance(specifiedWord = null) {
            let word = specifiedWord;
            if (!word) {
                word = VOCABULARY[Math.floor(Math.random() * VOCABULARY.length)];
            }

            const fishEl = document.createElement('div');
            fishEl.className = 'fish';
            
            const randomSvg = FISH_SVGs[Math.floor(Math.random() * FISH_SVGs.length)];
            fishEl.innerHTML = `
                <div class="fish-body">${randomSvg}</div>
                <div class="fish-text">${word}</div>
            `;
            
            elFishingArea.appendChild(fishEl);

            // Set physics properties
            const direction = Math.random() > 0.5 ? 1 : -1;
            const areaWidth = elFishingArea.offsetWidth || 800;
            const areaHeight = elFishingArea.offsetHeight || 500;
            
            let x = direction === 1 ? -140 : areaWidth + 20;
            // Bound vertical swimming scope safely between sky lines and seabed
            let y = 60 + Math.random() * (areaHeight - 160); 
            let speed = 1.2 + Math.random() * 1.8;

            fishEl.style.transform = `translate(${x}px, ${y}px) scaleX(${-direction})`;

            const fishObj = {
                el: fishEl,
                word: word,
                x: x,
                y: y,
                speed: speed,
                direction: direction,
                sinOffset: Math.random() * 100,
                sinSpeed: 0.02 + Math.random() * 0.03
            };

            fishEl.addEventListener('click', (e) => handleFishCatch(fishObj, e));
            fishEl.addEventListener('touchstart', (e) => {
                e.preventDefault();
                handleFishCatch(fishObj, e);
            });

            state.activeFish.push(fishObj);
        }

        function handleFishCatch(fish, event) {
            event.stopPropagation();
            
            if (fish.word === state.targetWord) {
                // Correct Catch Sequence
                AudioSystem.playSuccess();
                triggerConfettiAt(fish.x + 60, fish.y + 35);
                
                state.score += 10;
                state.correctCount += 1;
                elScore.textContent = state.score;
                
                // Update Target Card Displays
                elAvatarContainer.innerHTML = SVG_AVATARS[fish.word] || SVG_AVATARS.default;
                elWordDisplay.textContent = fish.word;
                elBtnSpeak.disabled = false;
                
                // Remove word from pool
                state.pool = state.pool.filter(w => w !== fish.word);
                
                // Light up star reward system slots
                const starSlot = document.getElementById(`star-slot-${state.correctCount - 1}`);
                if (starSlot) starSlot.classList.add('earned');
                
                // Clear caught asset from DOM
                removeFishInstance(fish);
                
                // Speak verification confirmation audio strings
                elCardDisplay.classList.add('highlight');
                elWordDisplay.classList.add('active-speaking');
                
                speak(`Great job! This is ${fish.word}!`, () => {
                    elCardDisplay.classList.remove('highlight');
                    elWordDisplay.classList.remove('active-speaking');
                    
                    // Evaluate Milestones
                    if (state.correctCount === 5) {
                        triggerMilestoneModal("Amazing!", "You caught 5 family members! You're an expert fisher!");
                    } else {
                        selectNextTarget();
                    }
                });
                
            } else {
                // Incorrect Catch Sequence
                AudioSystem.playError();
                // Play feedback shake animation on selected target
                fish.el.style.backgroundColor = 'rgba(255,0,0,0.2)';
                setTimeout(() => fish.el.style.backgroundColor = 'transparent', 300);
                speak("Try again!");
            }
        }

        function removeFishInstance(fish) {
            if(fish.el && fish.el.parentNode) {
                fish.el.parentNode.removeChild(fish.el);
            }
            state.activeFish = state.activeFish.filter(f => f !== fish);
        }

        /**********************************************************************
         * CORE REALTIME SIMULATION LOOPS (ENGINE DRIVER)
         **********************************************************************/
        function gameLoop(timestamp) {
            const areaWidth = elFishingArea.offsetWidth || 800;
            
            // Swim and position dynamic entities
            for(let i = state.activeFish.length - 1; i >= 0; i--) {
                let fish = state.activeFish[i];
                fish.x += fish.speed * fish.direction;
                
                // Wave function horizontal variance generator
                fish.sinOffset += fish.sinSpeed;
                let currentY = fish.y + Math.sin(fish.sinOffset) * 1.5;

                fish.el.style.transform = `translate(${fish.x}px, ${currentY}px) scaleX(${-fish.direction})`;

                // Assess out of bounds parameters for recycling loops
                if ((fish.direction === 1 && fish.x > areaWidth + 50) || 
                    (fish.direction === -1 && fish.x < -160)) {
                    removeFishInstance(fish);
                    createFishInstance();
                }
            }

            // Maintain target concentration variables dynamically
            if (state.activeFish.length < 5) {
                createFishInstance();
            }

            updateVisualFx();
            requestAnimationFrame(gameLoop);
        }

        /**********************************************************************
         * PARTICLE GRAPHICS & VISUAL FX (CONFETTI ENGINES)
         **********************************************************************/
        function triggerConfettiAt(x, y) {
            const colors = ['#ff4081', '#00e676', '#b2ff59', '#ffeb3b', '#ff9100', '#2979ff', '#e040fb'];
            for (let i = 0; i < 40; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.7) * 12,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    radius: 4 + Math.random() * 6,
                    alpha: 1,
                    decay: 0.015 + Math.random() * 0.02
                });
            }
        }

        function updateVisualFx() {
            ctxFx.clearRect(0, 0, canvasFx.width, canvasFx.height);
            
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.25; // gravity simulation components
                p.alpha -= p.decay;

                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                    continue;
                }

                ctxFx.save();
                ctxFx.globalAlpha = p.alpha;
                ctxFx.fillStyle = p.color;
                ctxFx.beginPath();
                ctxFx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctxFx.fill();
                ctxFx.restore();
            }
        }

        /**********************************************************************
         * MODAL / INTERACTIVE EVENT COORDINATIONS
         **********************************************************************/
        function triggerMilestoneModal(title, text) {
            AudioSystem.playMilestone();
            elMilestoneTitle.textContent = title;
            elMilestoneText.textContent = text;
            elMilestoneOverlay.classList.remove('hidden');
        }

        function triggerEndGameCelebration() {
            // Global transformation to structural champion certification display
            AudioSystem.playMilestone();
            elTargetPrompt.textContent = "🏆 CHAMPION! 🏆";
            
            elAvatarContainer.innerHTML = SVG_AVATARS.Family;
            elWordDisplay.textContent = "Family Vocabulary Champion!";
            elBtnSpeak.disabled = true;

            // Continual cascading fireworks across coordinates
            let fireworkInterval = setInterval(() => {
                if(state.pool.length > 0) { clearInterval(fireworkInterval); return; }
                let rx = Math.random() * canvasFx.width;
                let ry = Math.random() * (canvasFx.height * 0.6);
                triggerConfettiAt(rx, ry);
            }, 450);

            triggerMilestoneModal("🎖️ Congratulations! 🎖️", "You are a Family Vocabulary Champion! You know all your family words perfectly!");
        }

        // Click to replay target audio vocabulary card system profiles
        elBtnSpeak.addEventListener('click', () => {
            let currentWord = elWordDisplay.textContent;
            if (VOCABULARY.includes(currentWord)) {
                elCardDisplay.classList.add('highlight');
                elWordDisplay.classList.add('active-speaking');
                speak(currentWord, () => {
                    elCardDisplay.classList.remove('highlight');
                    elWordDisplay.classList.remove('active-speaking');
                });
            }
        });

        // Initialize engine tracking systems on explicit manual validation gestures
        elBtnStart.addEventListener('click', () => {
            elStartOverlay.classList.add('hidden');
            AudioSystem.init();
            initGame();
        });

        elBtnMilestoneContinue.addEventListener('click', () => {
            elMilestoneOverlay.classList.add('hidden');
            if (state.pool.length > 0) {
                selectNextTarget();
            } else {
                // Restart structure protocol sequence variations
                state.score = 0;
                state.correctCount = 0;
                state.pool = [...VOCABULARY];
                elScore.textContent = "0";
                buildTrackerSlots();
                selectNextTarget();
            }
        });

        // Audio environmental control panels
        const btnMuteSfx = document.getElementById('mute-sfx');
        btnMuteSfx.addEventListener('click', () => {
            AudioSystem.sfxMuted = !AudioSystem.sfxMuted;
            btnMuteSfx.textContent = AudioSystem.sfxMuted ? '❌' : '🔊';
        });

        const btnMuteMusic = document.getElementById('mute-music');
        btnMuteMusic.addEventListener('click', () => {
            AudioSystem.musicMuted = !AudioSystem.musicMuted;
            btnMuteMusic.textContent = AudioSystem.musicMuted ? '🔇' : '🎵';
        });
    </script>
</body>
</html>
